<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg" href="images/favicon.svg"/>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/template.css">
  <title>민라미님의 프로필</title>
  <style>
    :root{
      --primary-color: #e95256;
    }
    
    body{
      font-family: 'SCDream', serif;
      font-weight: 400;
      color: #333;
    }

    .inner.top-area{
      background-color: #333 !important;
    }
    .inner.top-area section{
      position: relative;
      padding: 50px 50px 140px 50px;
    }
    .inner.top-area section:has(.land){
      padding: 80px 50px;
    }
    .com-info{
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }
    .com-info #companyName{
      font-weight: 600;
    }
    .com-info #englishCompanyName{
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }
    .logo-area{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--primary-color);
      width: 40%;
      height: auto;
      object-fit: cover;
      padding: 25px 40px;
      border-radius: 0 15px 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-area.land{
      width: 50%;
    }
    .logo-area > img{
      width: 100%;
    }
    .logo-deco{
      display: inline-block;
      width: 50vw;
      height: max-content;
      background-color: var(--primary-color);
      position: absolute;
      top: 50%;
      right: calc(100% - 1px);
      transform: translateY(-50%);
    }
    .inner.bottom-area section{
      padding: 140px 50px 50px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 50px;
    }
    .inner.top-area:has(.land) ~ .inner.bottom-area section{
      padding: 80px 20px;
    }
    .user-info{
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .type-write {
        width: 0px;
        padding-right: 0;
        margin-bottom: 20px;
        font-family: 'CursiveSans', serif;
        font-weight: 900;
        font-size: 20px;
        color: color-mix(in oklab, var(--primary-color) 30%, #ffffff 70%);
        border-right: 2px solid rgba(0, 0, 0, 0.2);
        align-self: center;
        white-space: nowrap;
        overflow: hidden;
        animation: blink 0.5s infinite, typeWrite 2s steps(20) forwards;
    }
    @keyframes blink {
      50%{
        border-color: transparent;
      }
    }
    @keyframes typeWrite {
      from{
        width: 0px;
        padding-right: 0;
      }
      to{
        width: 183.5px;
        padding-right: 10px;
      }
    }
    .name{
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .user-info #name{
      font-weight: 800;
      font-size: 40px;
    }
    .user-info #englishName{
      font-family: 'CursiveSans', serif;
      font-weight: 900;
      font-size: 20px;
      color: var(--primary-color);
    }
    .line{
      width: 100%;
      height: 1px;
      background-image: linear-gradient(90deg,transparent 50%, var(--primary-color) 0);
      background-size: 200%;
      background-position: 0%;
      animation: lineMotion 2s ease-out forwards;
    }
    @keyframes lineMotion {
      0%{
        background-position: 0%;
      }
      100%{
        background-position: -100%;
      }
    }
    .rank{
      display: flex;
    }
    .rank > span{
      font-size: 20px;
      line-height: 1.9;
    }
    .rank > span::after{
      content: '/';
      color: rgba(0, 0, 0, 0.2);
      padding: 5px;
    }
    .rank > span:last-child::after{
      content: none;
      padding: 0;
    }

    .communication-info{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .communication-info > span{
      position: relative;
      display: flex;
      gap: 10px;
    }
    .communication-info > span:last-child{
      border-bottom: none;
    }
    .communication-info > span::before{
      width: 15px;
      color: var(--primary-color);
      font-weight: 900;
      text-align: center;
    }
    .communication-info #mobile::before{
      content: 'M';
    }
    .communication-info #fax::before{
      content: 'F';
    }
    .communication-info #email::before{
      content: 'E';
    }
    .communication-info #address::before{
      content: 'A';
    }

    .sns{
      display: flex;
      gap: 5px;
    }
    .sns > a{
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 600;
      padding: 5px 15px;
      background-color: var(--primary-color);
      color: #ffffff;
      border-radius: 8px;
    }
    .sns > a::after{
      content: url(/images/open_in_new.svg);
      display: inline-block;
      padding-top: 5px;
    }
    .sns > a::before{
      display: inline-block;
      padding-top: 3px;
    }
    .sns > a:first-child::before{
      content: url(images/tiktok-ico.svg);
    }
    .sns > a:nth-child(2)::before{
      content: url(images/instagram-ico.svg);
    }

    #intro{
      padding: 15px;
      border: 1px dashed var(--primary-color);
      color: #333;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="templateWrap">
    <div class="inner top-area">
      <section>
        <div class="com-info">
          <span id="companyName" data-field="companyName">콰드</span>
          <span id="englishCompanyName" data-field="englishCompanyName">Quad</span>
        </div>
        <div class="logo-area land"><img id="previewImage" data-field="previewImage" src="images/qard-logo-white.svg" alt="로고"><div class="logo-deco"></div></div>
      </section>
    </div>
    <div class="inner bottom-area">
      <section>
        <div class="user-info">
          <p class="type-write">Nice to meet you!</p>
          <div class="name">
            <span id="name" data-field="name">민라미</span>
            <span id="englishName" data-field="englishName">Rami, Min</span>
          </div>
          <div class="line"></div>
          <div class="rank">
            <span id="teamName" data-field="teamName">QARD</span>
            <span id="rank" data-field="rank">대표</span>
          </div>
        </div>
        <div class="communication-info">
          <span id="mobile" data-field="mobile">010-5514-8700</span>
          <!-- <span id="fax" data-field="fax">042-1234-5678</span> -->
          <span id="email" data-field="email">qardworks@gmail.com</span>
          <!-- <span id="address" data-field="address">대전광역시 유성구 왕가봉로2번길 76 (노은동) 자인빌</span> -->
        </div>
        <div class="sns">
          <a href="https://www.tiktok.com/@circle.rami?_r=1&_t=ZS-98dciZHgPYH" target="_blank" title="새창 열림">TikTok</a>
          <a href="https://www.instagram.com/circle.rami?igsh=MW5sNGl1MGJocGExMA%3D%3D&utm_source=qr" target="_blank" title="새창 열림">Instagram</a>
        </div>
        <p id="intro" data-field="intro">만남을 기억으로 바꾸는 작은 사각형!🎉<br>콰드(QARD)의 대표 민라미라고 합니다.<br>오늘 스쳐가는 많은 만남들 사이에서<br>저와의 만남은 오래 기억되었으면 좋겠습니다☺️<br>콰드(QARD)가 뭔지 궁금하시다면<br>틱톡과 인스타를 방문해주세요!😉</p>
      </section>
    </div>
  </div>

  <script>

      // logo-deco 있을 시 높이 값 자동 계산
      const img = document.getElementById("previewImage");
      const wrapper = document.querySelector(".logo-area");
      const logoDeco = document.querySelector(".logo-deco");
      const logoHeight = wrapper.offsetHeight;

      wrapper.style.top = `calc(100% - ${logoHeight / 2}px)`;
      logoDeco.style.height = logoHeight + 'px';
      
  </script>
</body>
</html>
